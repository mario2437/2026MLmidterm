<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>머신러닝 2 중간고사 성적 조회</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2457c5; --accent-text: #ffffff; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151c; --card: #1a2029; --text: #e8ebf0; --muted: #9aa3b2;
      --line: #2a313d; --accent: #6b9aff; --accent-text: #0e1420; --err: #f28b82;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11151c; --card: #1a2029; --text: #e8ebf0; --muted: #9aa3b2;
    --line: #2a313d; --accent: #6b9aff; --accent-text: #0e1420; --err: #f28b82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 1.5rem; margin: 0 0 4px; }
  header p { margin: 0 0 24px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .stat dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
  .stat dl div { text-align: center; }
  .stat dt { font-size: 0.8rem; color: var(--muted); }
  .stat dd { margin: 0; font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-weight: 400; }
  form h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 1rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 11px 18px; font-size: 1rem; font-weight: 600; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .hint { margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }
  .result { margin-top: 16px; }
  .result-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .who { font-size: 1.25rem; font-weight: 600; }
  .grade-badge {
    min-width: 64px; padding: 8px 14px; text-align: center; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font-size: 1.5rem; font-weight: 700;
  }
  .total { margin: 14px 0 10px; font-size: 1.1rem; }
  .total strong { font-size: 1.6rem; }
  table.breakdown { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .breakdown th, .breakdown td { padding: 8px 6px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
  .breakdown th { font-weight: 600; color: var(--muted); font-size: 0.85rem; }
  .breakdown td:nth-child(2) { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note { margin: 12px 0 0; font-size: 0.85rem; color: var(--muted); }
  .err { color: var(--err); margin: 0; }
  footer { margin-top: 32px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>2026학년도 2학기 머신러닝 2 · 중간고사 성적 조회</h1>
    <p>분반별 통계를 확인하고, 학번과 이름을 입력하면 본인의 점수와 등급을 볼 수 있습니다.</p>
  </header>

  <div id="stats" class="stats" aria-live="polite"></div>

  <form id="lookup" class="card" autocomplete="off">
    <h2>내 성적 조회</h2>
    <div class="fields">
      <div>
        <label for="sid">학번</label>
        <input id="sid" name="sid" inputmode="numeric" pattern="[0-9]*" placeholder="예: 24016001" required>
      </div>
      <div>
        <label for="sname">이름</label>
        <input id="sname" name="sname" placeholder="예: 홍길동" required>
      </div>
      <button type="submit">조회</button>
    </div>
    <p class="hint">학번과 이름이 모두 정확해야 조회됩니다. 성적 데이터는 암호화되어 있어 본인 외에는 볼 수 없습니다.</p>
  </form>

  <div id="result" class="card result" hidden></div>

  <footer>수원대학교 AI데이터과학부 · 머신러닝 2 · 문의: 담당 교수</footer>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
